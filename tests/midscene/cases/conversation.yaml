cases:
  - name: CHAT-01 General answer completes after a clarification
    tags: [live, conversation, clarification, ci-core]
    steps:
      - app.open: {}
      - aiAct: >-
          Return to Tapilot's main chat. Open the conversation dropdown using the
          speech-bubble icon at the top right beside the speaker icon, then select
          New conversation / 新建会话. The message area must become empty, even if the
          previous conversation already contains a similar test request. Preserve all
          model and speech settings. Do not type, submit a task or start the microphone.
      - aiAssert: >-
          Tapilot shows an empty new conversation with an empty composer. No earlier user
          messages, assistant answers or error bubbles are visible in the message area.
      - aiAct: >-
          In this empty conversation, submit this exact text: "帮我算两个数相乘。先问我是哪两个数，等我下一条消息再计算。不要操作手机，不用语音。"
          Stop interacting after submission; do not answer on Tapilot's behalf.
      - task.waitForIdle: {}
      - aiAssert: >-
          Tapilot asks which two numbers to multiply. The reply is waiting for the user's
          answer and does not claim that a calculation or phone action is complete.
      - aiAct: >-
          In this same conversation, submit "50 和 2，请直接告诉我结果。" using text.
          Do not create another conversation, change modes or open Calculator.
          Stop interacting after submission.
      - task.waitForIdle: {}
      - aiAssert: >-
          The newest Tapilot reply gives 100 as the product of 50 and 2. Its status is
          completed ("Completed" or "任务已完成"), with zero phone operations. The newest
          reply must not say "Waiting for your answer" or "等待你的回答". The earlier
          clarification may still retain its historical waiting status.
