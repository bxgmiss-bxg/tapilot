name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  midscene-e2e:
    name: Midscene E2E checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json
      - run: npm ci --prefix tests/midscene
      - name: Apply reviewed Midscene compatibility even when npm disables scripts
        run: node plugins/tapilot/scripts/patch-midscene-zod.mjs tests/midscene
      - name: Validate E2E types, cases and fixture guards (no device or model)
        run: npm --prefix tests/midscene run check
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix plugins/tapilot
      - run: npm ci --prefix tests/midscene
      - name: Apply reviewed Midscene compatibility even when npm disables scripts
        run: |
          node plugins/tapilot/scripts/patch-midscene-zod.mjs plugins/tapilot
          node plugins/tapilot/scripts/patch-midscene-zod.mjs tests/midscene
      - run: pnpm check:security
      - name: Verify standalone CLI installation and portable image runtime
        run: pnpm check:cli-package
      - run: pnpm check
      - name: Measure model-free conversation overhead
        run: |
          mkdir -p build/performance
          node scripts/benchmark-conversation.mjs > build/performance/conversation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build/performance/
            app/src/main/assets/third-party/
            app/build/generated/third-party-assets/
